name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# One run per branch or PR. Pushing again cancels the run still in flight
# rather than leaving both to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned rather than ubuntu-latest: this is the newest runner image that
    # actions/python-versions ships a Python 3.9 build for. When ubuntu-latest
    # moves past 24.04, an unpinned image would stop resolving 3.9.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Python 3.9 is what the warrior runs, and it is also the ceiling for
      # this package: the pinned Tornado 4 dependency uses
      # `collections.MutableMapping`, removed from the standard library in
      # Python 3.10. Lifting that ceiling requires porting off Tornado 4.
      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Run tests
        # Several tests shell out to ./run-pipeline3, whose shebang is
        # `#!/usr/bin/env python3`. setup-python puts the selected interpreter
        # first on PATH, so that resolves to the same environment the
        # dependencies were installed into.
        #
        # What is measured and what is left out lives in .coveragerc.
        run: coverage run -m pytest tests -v

      - name: Coverage report
        run: |
          coverage report
          coverage xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py39
          path: coverage.xml
          if-no-files-found: warn
